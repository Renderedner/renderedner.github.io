worker_processes  2;

error_log  /var/log/nginx/error.log  debug;

events {
    worker_connections  1024;
}

http {
    server {
    server_name autofy-api.justclaymoving.xyz;
    location / {
    proxy_pass http://127.0.0.1:8083;
    }
    

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/justclaymoving.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/justclaymoving.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

    server {
    server_name autofy.justclaymoving.xyz;
    location / {
    proxy_pass http://127.0.0.1:8082;
